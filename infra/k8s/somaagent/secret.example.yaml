# =============================================================================
# MODEL PROVIDER KEYS — SEED VAULT, NEVER THE ENVIRONMENT
# =============================================================================
# This file is a RUNBOOK, not a manifest. Do not `kubectl apply` it.
#
# VIBE SECURITY: NEVER commit real keys to Git. NEVER put provider keys in a
# Deployment env var, a ConfigMap, or a .env file.
#
# ── Where model credentials live ─────────────────────────────────────────────
# The agent has full model administration:
#
#   * LLMModelConfig (Django admin, app `admin.llm`) selects which model and
#     provider to route to. Seeded by admin/llm/migrations/0004_seed_groq_models.py.
#   * UnifiedSecretManager.get_provider_key(provider) reads the key from Vault
#     at  secret/agent/api_keys  field  {provider}_api_key
#     (services/common/unified_secret_manager.py:26,80-88).
#   * get_api_key() is FAIL-CLOSED: a missing key raises LLMNotConfiguredError
#     (admin/llm/services/litellm_helpers.py:144-148). It never falls back to env.
#
# ── How to seed it ───────────────────────────────────────────────────────────
#   vault kv put secret/agent/api_keys groq_api_key='<real key>'
#   vault kv put secret/agent/api_keys openai_api_key='<real key>'
#
#   # or through the agent's own API (stores into the same Vault path):
#   #   admin/aaas/api/settings.py — POST provider key →
#   #   secret/agent/api_keys/{provider}_api_key
#
# ── Key rotation ─────────────────────────────────────────────────────────────
#   vault kv put secret/agent/api_keys groq_api_key='<new key>'
#   then flush the Django cache entry `llm_api_key:<provider>`
#   (admin/core/api/llm.py:133 caches it for 300s).
#
# There is no k8s Secret for provider keys and no GROQ_API_KEY env var in
# deployment.yaml. Adding either back creates a second, unread source of truth.
# =============================================================================
