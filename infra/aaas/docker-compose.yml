version: "3.8"

# =============================================================================
# SOMA AGENT-AS-A-SERVICE (AAAS) DOCKER COMPOSE
# =============================================================================
# Runs the unified AAAS stack with all infrastructure services.
# Agent + Brain + Memory run as ONE container (single-process mode).
#
# SECRET CONTRACT (VIBE Rule 164) — same contract as infra/standalone:
#
#   * No secret value is written in this file, in .env, or in any file under
#     version control. Env vars here are topology only: hosts, ports, names.
#   * The application reads every secret from Vault via UnifiedSecretManager.
#   * Postgres and Keycloak cannot read Vault and need a password at first
#     init. They get it as a Docker secret (a mounted file) — never as an
#     environment variable. The official postgres image reads *_FILE variants.
#   * Nothing is a secret in an environment variable. Not even the Vault root
#     token.
#   * Host publish ports are <SVC>_HOST_PORT (default 639xx). Do not reuse
#     POSTGRES_PORT / REDIS_PORT / SOMA_PORT for those — in .env those are
#     the ports the app dials INSIDE the compose network. Overloading one
#     name for both meanings publishes 5432:5432 and collides with the host.
#   * This stack is local TEST topology for the 639xx ports that
#     tests/conftest.py declares. It reuses the deployer-supplied secret FILES
#     from ../standalone/secrets/ rather than carrying a second copy of the
#     same material — one set of bootstrap files per machine, not per stack.
# =============================================================================

networks:
  somastack_network:
    driver: bridge

volumes:
  somastack_postgres_data:
  somastack_redis_data:
  somastack_milvus_data:
  somastack_kafka_data:
  somastack_vault_data:
  somastack_logs:

# Deployer-supplied secret FILES for THIS stack only. See ./secrets/README.md.
# Gitignored. Deliberately not ../standalone/secrets/: a relative path into a
# sibling stack couples two independent deployments and silently shares
# credentials between them. Each stack owns its own bootstrap material.
#
# These are PATHS, never values. Every application-level secret is in Vault and
# is read from there at runtime; only the material below has to exist as a file,
# because the services that consume it cannot read Vault at first init.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  # The least-privileged test/application role password. Distinct from
  # postgres_password (the cluster superuser) — least privilege, two secrets.
  test_db_password:
    file: ./secrets/test_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  # Vault lifecycle credentials — the only two secrets that cannot live inside
  # Vault itself. Generated by vault_unseal.py on first init.
  vault_root_token:
    file: ./secrets/vault_root_token
  vault_unseal_key:
    file: ./secrets/vault_unseal_key

services:
  # ===========================================================================
  # MAIN APPLICATION - Agent + Brain + Memory as ONE
  # ===========================================================================
  somastack_aaas:
    build:
      context: ../../..
      dockerfile: somaAgent01/infra/aaas/Dockerfile
    container_name: somastack_aaas
    hostname: somastack_aaas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SOMA_SINGLE_PROCESS=true
      - SOMA_AAAS_MODE=true
      - SA01_DEPLOYMENT_MODE=AAAS
      - DJANGO_SETTINGS_MODULE=infra.aaas.unified_settings
      - SOMA_POSTGRES_HOST=somastack_postgres
      - SOMA_REDIS_HOST=somastack_redis
      - SOMA_MILVUS_HOST=somastack_milvus
      # Every application secret is read from Vault. These two are the ONLY
      # Vault wiring the app needs: where Vault is (topology) and which FILE
      # holds the token (a path, never the credential). There is no VAULT_TOKEN
      # environment variable — a token in env is visible in `ps`, in
      # /proc/*/environ and in every crash dump (VIBE Rule 164).
      - VAULT_ADDR=http://somastack_vault:8200
      - VAULT_TOKEN_FILE=/run/secrets/vault_root_token
    ports:
      - "${SOMA_HOST_PORT:-63900}:9000"
    depends_on:
      somastack_postgres:
        condition: service_healthy
      somastack_redis:
        condition: service_started
      somastack_milvus:
        condition: service_started
      somastack_vault:
        condition: service_started
    secrets:
      - vault_root_token
    networks:
      - somastack_network
    volumes:
      - somastack_logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/v2/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # INFRASTRUCTURE SERVICES
  # ===========================================================================

  # PostgreSQL - Primary database
  somastack_postgres:
    # postgres:15 to match the somastack_postgres_data volume and the
    # standalone stack. A 16 image cannot read a 15 data directory:
    # "database files are incompatible with server". Align the stacks
    # rather than destroy a volume to chase a major version.
    image: postgres:15-alpine
    container_name: somastack_postgres
    restart: unless-stopped
    environment:
      # Topology only. The user is not a credential; the password is.
      POSTGRES_USER: ${POSTGRES_USER:-soma}
      # The official image reads *_FILE variants. The password arrives as a
      # mounted Docker secret — never as an environment variable in this file.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_MULTIPLE_DATABASES: somaagent,somabrain,somamemory
      TEST_DB_USER: ${TEST_DB_USER:-somaagent}
      TEST_DB_PASSWORD_FILE: /run/secrets/test_db_password
    secrets:
      - postgres_password
      - test_db_password
    ports:
      - "${POSTGRES_HOST_PORT:-63932}:5432"
    volumes:
      - somastack_postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - somastack_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching and pub/sub
  somastack_redis:
    image: redis:7-alpine
    container_name: somastack_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-63979}:6379"
    volumes:
      - somastack_redis_data:/data
    networks:
      - somastack_network
    command: redis-server --appendonly yes

  # Milvus - Vector database
  somastack_milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: somastack_milvus
    restart: unless-stopped
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_HOST_PORT:-63953}:19530"
    volumes:
      - somastack_milvus_data:/var/lib/milvus
    networks:
      - somastack_network

  # Kafka - Event streaming
  somastack_kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: somastack_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://somastack_kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@somastack_kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: aaas-kafka-cluster
    ports:
      - "${KAFKA_HOST_PORT:-63992}:9092"
    volumes:
      - somastack_kafka_data:/var/lib/kafka/data
    networks:
      - somastack_network

  # Keycloak - Identity and access management
  somastack_keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: somastack_keycloak
    restart: unless-stopped
    environment:
      # Usernames are topology. Both passwords arrive as mounted Docker secrets.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://somastack_postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-soma}
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - keycloak_admin_password
      - postgres_password
    command: start-dev
    ports:
      - "${KEYCLOAK_HOST_PORT:-63980}:8080"
    depends_on:
      - somastack_postgres
    networks:
      - somastack_network

  # OPA - Open Policy Agent
  somastack_opa:
    image: openpolicyagent/opa:0.60.0
    container_name: somastack_opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
    ports:
      - "${OPA_HOST_PORT:-63981}:8181"
    networks:
      - somastack_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault - Secrets management
  somastack_vault:
    image: hashicorp/vault:1.15
    container_name: somastack_vault
    restart: unless-stopped
    # Invoke `vault` directly. The image's docker-entrypoint.sh rewrites any
    # `server` command and injects -dev-root-token-id / -dev-listen-address,
    # which are dev-mode flags and have no business in a real server. A
    # command that ALSO names a config file loads it twice — two tcp
    # listeners on 8200, "bind: address already in use".
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - somastack_vault_data:/vault/data
    ports:
      - "${VAULT_HOST_PORT:-63982}:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - somastack_network
    healthcheck:
      # Healthy means "the API answers", NOT "unsealed". `vault status` exits 2
      # when sealed and 1 when unreachable, so anything except 1 is a live API
      # the unseal step can talk to. Gating on "unsealed" would deadlock.
      test: [ "CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

