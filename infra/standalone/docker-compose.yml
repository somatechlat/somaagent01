# ═══════════════════════════════════════════════════════════════════════════════
# 🐳 SOMAAGENT01 STANDALONE DEPLOYMENT
# ═══════════════════════════════════════════════════════════════════════════════
# Agent-Only deployment without SomaBrain or FractalMemory dependencies.
# - Naming: somaagent_*
# - Ports: 20xxx (Strict Isolation from AAAS 63xxx)
#
# SECRET CONTRACT (VIBE Rule 164) — read this before editing:
#
#   * No secret value is written in this file, in .env, or in any file under
#     version control. .env carries non-secret deployment topology only.
#   * The application reads every secret from Vault via UnifiedSecretManager:
#       secret/agent/credentials/<snake_case>       get_credential()
#       secret/agent/api_keys/<provider>_api_key    get_provider_key()
#     Keys are seeded by init_vault.py from ./secrets/ (gitignored).
#   * Two containers cannot read Vault and need a password at first init —
#     postgres and keycloak. They get it as a Docker secret (a mounted file),
#     never as an environment variable in this file.
#   * NOTHING is a secret in an environment variable. Not even the Vault root
#     token. It authenticates TO Vault so it cannot itself live in Vault, but it
#     is still a credential, so it is delivered as a Docker secret file
#     (./secrets/vault_root_token) exactly like postgres_password. Env vars in
#     this file are topology only: hosts, ports, names, toggles.
#   * Vault is RESILIENT: server mode with `file` storage on the
#     somaagent_vault_data volume, so credentials survive a container restart.
#     It starts sealed and vault_unseal.py unseals it with the deployer-held key
#     from ./secrets/vault_unseal_key. Dev mode would keep secrets in RAM and
#     lose every one of them on restart — that is not a deployment.
#
# LOCAL LIMITATIONS vs production — deliberate, named, and documented in
# README.md §"Local limitations". In short: Keycloak runs in start-dev mode, the
# 1-of-1 unseal key is held by the deployer rather than auto-unseal against a
# KMS, and there is no TLS. Everything else matches the production shape.
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  somaagent_net:
    driver: bridge

volumes:
  somaagent_postgres_data:
  somaagent_redis_data:
  # Vault's `file` storage backend. Keeping this on a named volume is what makes
  # the secrets store survive `docker compose restart` and `down`/`up`.
  somaagent_vault_data:

# Deployer-supplied secret FILES. See ./secrets/README.md. Gitignored.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  # Generated by vault_unseal.py on first init. These are the Vault lifecycle
  # credentials — the only two secrets that cannot live inside Vault itself.
  vault_root_token:
    file: ./secrets/vault_root_token
  vault_unseal_key:
    file: ./secrets/vault_unseal_key

services:
  # ===========================================================================
  # 1. SOMAAGENT API (Standalone Mode)
  # ===========================================================================
  somaagent_standalone:
    container_name: somaagent_standalone
    build:
      context: ../../
      dockerfile: infra/standalone/Dockerfile
    env_file:
      # Non-secret deployment topology ONLY. No passwords, no tokens, no DSNs.
      - .env
    environment:
      - SA01_DEPLOYMENT_MODE=STANDALONE
      - SOMA_AAAS_MODE=false
      # Vault is the only source of secrets for this container.
      - VAULT_ADDR=http://somaagent_vault:8200
      # A PATH, not a token. The Vault token is a credential and is therefore
      # delivered as a mounted secret file — never as an environment variable,
      # where `ps`, /proc/*/environ and every core dump could read it.
      - VAULT_TOKEN_FILE=/run/secrets/vault_root_token
      - SA01_JWT_ISSUER_STRICT=false
      # MODEL CREDENTIALS DO NOT LIVE IN ENV. The agent has full model
      # administration: LLMModelConfig (Django admin) selects the model and
      # UnifiedSecretManager.get_provider_key() reads provider keys from Vault
      # at secret/agent/api_keys/{provider}_api_key (fail-closed). Never put
      # GROQ_API_KEY / OPENAI_API_KEY here — seed them with init_vault.py.
      - AAAS_DEFAULT_CHAT_MODEL=groq/openai/gpt-oss-120b
      - AAAS_DEFAULT_TENANT_ID=${AAAS_DEFAULT_TENANT_ID:?set AAAS_DEFAULT_TENANT_ID}
      # Real triad memory lane (T-1). Brain is the sole writer; SFM is the store.
      # The tokens these need are in Vault at
      #   secret/agent/credentials/soma_api_token
      #   secret/agent/credentials/somabrain_memory_http_token
      # and are read there by services/gateway/settings.py. They are deliberately
      # NOT passed here.
      - SOMABRAIN_ENABLED=true
      - SOMABRAIN_URL=${SOMABRAIN_URL:-http://host.docker.internal:30101}
      - SOMAFRACTALMEMORY_URL=${SOMAFRACTALMEMORY_URL:-http://host.docker.internal:10101}
      - MEM_EMBED_DIM=${MEM_EMBED_DIM:-768}
      # Database topology — parts, not a DSN. A DSN embeds the password.
      # The password is read from Vault (secret/agent/credentials/postgres_password)
      # by config/settings_registry.py and assembled into DATABASES there.
      # No DSN is formed anywhere in ENV, here or in the container.
      - SA01_DB_HOST=somaagent_postgres
      - SA01_DB_PORT=5432
      - SA01_DB_NAME=somaagent
      - SA01_DB_USER=somaagent
      - POSTGRES_HOST=somaagent_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=somaagent
      - POSTGRES_USER=somaagent
    secrets:
      - vault_root_token
    ports:
      - "20020:9000" # Agent API
    networks:
      - somaagent_net
    volumes:
      - ../../admin:/app/admin
      - ../../services:/app/services
      - ../../config:/app/config
      - ../../manage.py:/app/manage.py
      - ../../soma-compatibility.json:/app/soma-compatibility.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      somaagent_vault:
        condition: service_healthy
      # The app reads secrets from Vault at import time. Seeding must have
      # finished before the process starts, or every get_credential() is None.
      somaagent_vault_init:
        condition: service_completed_successfully
      somaagent_postgres:
        condition: service_healthy
      somaagent_redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          memory: 1024M

  # ===========================================================================
  # 2. VAULT (Secrets Management - VIBE Rule 164)
  # ===========================================================================
  # Server mode with `file` storage on a named volume. NOT dev mode: dev mode
  # keeps secrets in RAM, so `docker compose restart` silently discards every
  # credential and the whole stack fail-closes with a "missing secret" error
  # that has nothing to do with what anyone changed. Credentials here survive.
  #
  # A real Vault starts SEALED. vault_unseal.py (next service) initialises it on
  # first boot and unseals it on every boot, using the deployer-held key at
  # ./secrets/vault_unseal_key. Production replaces that key with auto-unseal
  # against a cloud KMS; only the custodian of the key changes.
  somaagent_vault:
    container_name: somaagent_vault
    image: hashicorp/vault:1.15
    # Invoke `vault` directly. The image's docker-entrypoint.sh rewrites any
    # `server` command into `vault server -config=/vault/config -dev-...`, so a
    # command that ALSO names a config file loads it twice — two identical tcp
    # listeners on 8200 and "bind: address already in use" from a port nothing
    # else holds. It also injects -dev-root-token-id / -dev-listen-address,
    # which are dev-mode flags and have no business in a real server.
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    ports:
      - "20882:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - somaagent_vault_data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - somaagent_net
    healthcheck:
      # Healthy means "the API answers", NOT "unsealed". `vault status` exits 2
      # when sealed and 1 when unreachable, so anything except 1 is a live API
      # that the unseal step can talk to. Gating on "unsealed" would deadlock:
      # nothing could ever start the unseal.
      test: [ "CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ===========================================================================
  # 2a. VAULT LIFECYCLE (init-once, unseal-on-every-boot)
  # ===========================================================================
  # Runs vault_unseal.py. Initialises Vault exactly once — generating the root
  # token and unseal key into ./secrets/ — and unseals it on every subsequent
  # start. This is what makes the stack resilient across restarts.
  somaagent_vault_unseal:
    container_name: somaagent_vault_unseal
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./vault_unseal.py:/work/vault_unseal.py:ro
      # Read-WRITE: first boot writes the generated root token and unseal key
      # back into ./secrets/. Those files are gitignored and are the only copy.
      - ./secrets:/work/secrets
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      SECRETS_DIR: /work/secrets
    entrypoint: [ "python3", "/work/vault_unseal.py" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault:
        condition: service_healthy
    restart: "no"

  # ===========================================================================
  # 2b. VAULT SEEDER (one-shot)
  # ===========================================================================
  # Runs init_vault.py, which copies deployer-supplied values from ./secrets/
  # into Vault at the paths the application reads. Idempotent; exits non-zero
  # if a required secret file is absent, which is what makes the stack fail
  # closed rather than boot with a missing credential. Stdlib only — secret
  # values travel as bytes from file to HTTP body and never through a shell.
  somaagent_vault_init:
    container_name: somaagent_vault_init
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./init_vault.py:/work/init_vault.py:ro
      - ./secrets:/work/secrets:ro
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      # A PATH, not a token. The token is in the mounted file and never appears
      # in this environment block, in `docker inspect`, or in `ps`.
      VAULT_TOKEN_FILE: /run/secrets/vault_root_token
      SECRETS_DIR: /work/secrets
    secrets:
      - vault_root_token
    entrypoint: [ "python3", "/work/init_vault.py" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault_unseal:
        condition: service_completed_successfully
    restart: "no"

  # ===========================================================================
  # 3. POSTGRESQL (Database)
  # ===========================================================================
  somaagent_postgres:
    container_name: somaagent_postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: somaagent
      POSTGRES_DB: somaagent
      # The official image reads *_FILE variants. Password arrives as a mounted
      # Docker secret — never as an environment variable in this file.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=100"
    secrets:
      - postgres_password
    ports:
      - "20432:5432"
    volumes:
      - somaagent_postgres_data:/var/lib/postgresql/data
    networks:
      - somaagent_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U somaagent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 4. REDIS (Cache)
  # ===========================================================================
  # LOCAL LIMITATION: no auth. Production sets an ACL / requirepass, with the
  # password in Vault. Standalone Redis is on the isolated bridge network only.
  somaagent_redis:
    container_name: somaagent_redis
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "20379:6379"
    volumes:
      - somaagent_redis_data:/data
    networks:
      - somaagent_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 5. KEYCLOAK (Identity - Optional for Standalone)
  # ===========================================================================
  # LOCAL LIMITATION: `start-dev`. Production runs `start --optimized` behind
  # TLS with a real hostname.
  #
  # LOCAL LIMITATION: Keycloak documents KC_DB_PASSWORD and KEYCLOAK_ADMIN_PASSWORD
  # but ships no _FILE variant for either (keycloak.org/server/configuration).
  # The entrypoint below reads the mounted Docker secrets and exports them into
  # the process environment of THIS container only. The values are never in this
  # file, never in .env and never in git. The exec line is the upstream image's
  # own start-dev invocation.
  somaagent_keycloak:
    container_name: somaagent_keycloak
    image: quay.io/keycloak/keycloak:24.0
    entrypoint: [ "/bin/sh", "/deploy/entrypoint-keycloak.sh" ]
    environment:
      # KEYCLOAK_ADMIN is a username, not a secret.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://somaagent_postgres:5432/somaagent
      KC_DB_USERNAME: somaagent
    secrets:
      - postgres_password
      - keycloak_admin_password
    volumes:
      - ./entrypoint-keycloak.sh:/deploy/entrypoint-keycloak.sh:ro
    ports:
      - "20880:8080"
    networks:
      - somaagent_net
    depends_on:
      somaagent_postgres:
        condition: service_healthy

  # ===========================================================================
  # 6. WEBUI (Lit 3.x Frontend)
  # ===========================================================================
  somaagent_webui:
    container_name: somaagent_webui
    build:
      context: ../../webui
      dockerfile: Dockerfile
    ports:
      - "20080:80"
    networks:
      - somaagent_net
    volumes:
      # Live reload: host dist is served directly. `npm run build` in webui/
      # is enough — no image rebuild. nginx.conf also hot-mounted.
      - ../../webui/dist:/usr/share/nginx/html
      - ../../webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - somaagent_standalone
    restart: unless-stopped
