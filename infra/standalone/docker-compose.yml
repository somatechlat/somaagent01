# ═══════════════════════════════════════════════════════════════════════════════
# 🐳 SOMAAGENT01 STANDALONE DEPLOYMENT
# ═══════════════════════════════════════════════════════════════════════════════
# Agent-Only deployment without SomaBrain or FractalMemory dependencies.
# - Naming: somaagent_*
# - Ports: 20xxx (somaagent cluster; AAAS/somastack 63xxx stack is deleted)
#
# SECRET CONTRACT (VIBE Rule 164) — read this before editing:
#
#   * No secret value is written in this file, in .env, or in any file under
#     version control. .env carries non-secret deployment topology only.
#   * The application reads every secret from Vault via UnifiedSecretManager:
#       secret/agent/credentials/<snake_case>       get_credential()
#       secret/agent/api_keys/<provider>_api_key    get_provider_key()
# SOMA-STD-CONFIG-001 R-SEC-01 / Covenant Art 26 (the only law):
#   * Application secrets live ONLY in Vault. init_vault.py GENERATES them in
#     process memory and writes them to Vault. There is no SECRETS_DIR and no
#     secret file in this repo.
#   * R-SEC-03: env carries Vault bootstrap topology only (VAULT_ADDR).
#     Long-running app/tests receive ONLY the scoped TTL token
#     (agent_runtime_token) from the T0_DIR RAM tmpfs custodian. Root is for
#     unseal + policy one-shots and is never mounted into app/tests.
#   * The Vault unseal key cannot live in Vault. Custodian: OS keychain or
#     operator-held VAULT_UNSEAL_KEY (vault_unseal.py) — never a file in git.
#   * First-boot handoff to postgres/keycloak uses a RAM tmpfs (t0_ram), not
#     the disk and not the repo.
#   * Vault is RESILIENT: server mode, file storage on the somaagent_vault_data
#     volume (encrypted secret store), unsealed by vault_unseal.py each boot.
#
# LOCAL LIMITATIONS vs production — deliberate, named, and documented in
# README.md §"Local limitations". In short: Keycloak runs in start-dev mode, the
# 1-of-1 unseal key is held by the operator rather than auto-unseal against a
# KMS, and there is no TLS. Everything else matches the production shape.
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  somaagent_net:
    driver: bridge
  # The triad cluster. SomaBrain and SomaFractalMemory already share this
  # network and reach each other by service DNS. The agent joins it too, so
  # all three services are one cluster instead of three islands on one host.
  soma-stack-net:
    external: true

volumes:
  somaagent_postgres_data:
  somaagent_redis_data:
  # Vault's `file` storage backend. Keeping this on a named volume is what makes
  # the secrets store survive `docker compose restart` and `down`/`up`.
  somaagent_vault_data:
  # F-16: dedicated audit volume (SOMA-STD-BOOTSTRAP-001 §3.5). Never inside
  # /vault/data and never in the repo. Contents are HMAC-SHA256 under a
  # per-device salt — plaintext secrets never enter this file.
  somaagent_vault_audit:
  # PER-CONSUMER T0 (SOMA-STD-SECURITY-001 §1.4): scoped TTL tokens ONLY.
  # Root and unseal NEVER written here. 0700/0600. Not shared across app UIDs.
  t0_agent:
  t0_postgres:

# SOMA-STD-CONFIG-001 R-SEC-01 / Covenant Art 26:
#   Secrets live ONLY in Vault. There are NO secret files on disk and there is
#   NO `secrets: file:` block in this compose file. Period.
# R-SEC-03 allows env to carry Vault bootstrap topology only (VAULT_ADDR,
#   VAULT_TOKEN) so a one-shot seeder can authenticate TO Vault. Application
#   secrets (postgres, keycloak, API tokens) are generated in memory by
#   init_vault.py and exist only in Vault.
# Vault unseal key: not in Vault (chicken-and-egg). Custodian is the OS
#   keychain / operator-held VAULT_UNSEAL_KEY (see vault_unseal.py) — never a
#   file under the repo.

services:
  # ===========================================================================
  # 1. SOMAAGENT API (Standalone Mode)
  # ===========================================================================
  somaagent_standalone:
    container_name: somaagent_standalone
    entrypoint: ["/app/start.sh"]
    build:
      context: ../../
      dockerfile: infra/standalone/Dockerfile
    env_file:
      # Non-secret deployment topology ONLY. No passwords, no tokens, no DSNs.
      - .env
    environment:
      - SA01_DEPLOYMENT_MODE=STANDALONE
      # Vault is the only source of secrets for this container.
      - VAULT_ADDR=http://somaagent_vault:8200
      # R-SEC-03/zero-trust: LONG-RUNNING services get a scoped TTL token
      # (agent_runtime_token), never root. Root is for unseal/policy one-shots
      # only (SOMA-STD-BOOTSTRAP-001). Delivery is the T0_DIR RAM tmpfs
      # custodian written by vault_scoped_tokens.py — never SECRETS_DIR, never
      # a repo file. F-10: when this lease expires the service stops cleanly;
      # it must not widen policy, re-mint as root, or read a backup file.
      - VAULT_TOKEN_FILE=/run/t0/agent_runtime_token
      - PYTHONPATH=/app:/app/services/common/soma-memory-contract
      - VAULT_CACHE_TTL_SECONDS=0
      - VAULT_TOKEN_TTL_HOURS=${VAULT_TOKEN_TTL_HOURS:?set VAULT_TOKEN_TTL_HOURS}
      # Ceremony pre-mints agent_runtime_token into private t0_agent. This
      # process is the app only — root never runs here (SOMA-STD-SECURITY-001).
      # JWT issuer strictness is BEHAVIOUR (R-BEH-01). Schema default lives on
      # SettingsModel (sa01_jwt_issuer_strict, default true). Operators change it
      # through AgentSetting / Capsule / InfrastructureConfig — never ENV.
      # MODEL CREDENTIALS DO NOT LIVE IN ENV. The agent has full model
      # administration: LLMModelConfig (Django admin) selects the model and
      # UnifiedSecretManager.get_provider_key() reads provider keys from Vault
      # at secret/agent/api_keys/{provider}_api_key (fail-closed). Never put
      # GROQ_API_KEY / OPENAI_API_KEY here — seed them with init_vault.py.
      # Real triad memory lane (T-1). Brain is the sole writer; SFM is the store.
      # The tokens these need are in Vault at
      #   secret/agent/credentials/soma_api_token
      #   secret/agent/credentials/somabrain_memory_http_token
      # and are read there by services/gateway/settings.py. They are deliberately
      # NOT passed here.
      # Service endpoints are OPERATOR PARAMETERS, not an ENV contract: the
      # runtime resolves them through InfrastructureConfig (Capsule >
      # AgentSetting > InfrastructureConfig > SettingsModel) via
      # require_service_url. They are passed here only so the process has a
      # first value before the admin UI exists, and each is REQUIRED — there is
      # no default host, because a default is a hardcoded value an operator
      # cannot see and an auditor cannot audit.
      - SOMABRAIN_URL=${SOMABRAIN_URL:?set SOMABRAIN_URL}
      - SOMAFRACTALMEMORY_URL=${SOMAFRACTALMEMORY_URL:?set SOMAFRACTALMEMORY_URL}
      # Database topology — parts, not a DSN. A DSN embeds the password.
      # The password is read from Vault (secret/agent/credentials/postgres_password)
      # by config/settings_registry.py and assembled into DATABASES there.
      # No DSN is formed anywhere in ENV, here or in the container.
      - SA01_DB_HOST=somaagent_postgres
      - SA01_DB_PORT=5432
      - SA01_DB_NAME=somaagent
      - SA01_DB_USER=somaagent
      - POSTGRES_HOST=somaagent_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=somaagent
      - POSTGRES_USER=somaagent
    ports:
      - "20020:9000" # Agent API
    networks:
      - somaagent_net
      - soma-stack-net
    volumes:
      - t0_agent:/run/t0:rw
      - ./bootstrap_exec.py:/work/bootstrap_exec.py:ro
      - ./bootstrap_exec.sh:/work/bootstrap_exec.sh:ro
      - ./vault_unseal.py:/work/vault_unseal.py:ro
      - ./init_vault.py:/work/init_vault.py:ro
      - ./vault_scoped_tokens.py:/work/vault_scoped_tokens.py:ro
      - ./vault-policies:/work/vault-policies:ro
      - ../../admin:/app/admin
      - ../../services:/app/services
      - ../../config:/app/config
      - ../../manage.py:/app/manage.py
      - ../../soma-compatibility.json:/app/soma-compatibility.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      somaagent_vault:
        condition: service_healthy
      # Ceremonial seeder mints agent_runtime_token into private t0_agent first.
      somaagent_ceremony:
        condition: service_completed_successfully
      somaagent_postgres:
        condition: service_healthy
      somaagent_redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          memory: 1024M

  # ===========================================================================
  # 2. VAULT (Secrets Management - VIBE Rule 164)
  # ===========================================================================
  # Server mode with `file` storage on a named volume. NOT dev mode: dev mode
  # keeps secrets in RAM, so `docker compose restart` silently discards every
  # credential and the whole stack fail-closes with a "missing secret" error
  # that has nothing to do with what anyone changed. Credentials here survive.
  #
  # A real Vault starts SEALED. vault_unseal.py (next service) initialises it on
  # first boot and unseals it on every boot, using a key the operator holds in
  # the OS keychain or VAULT_UNSEAL_KEY (SOMA-STD-BOOTSTRAP-001 §2.3) — never
  # a file in this repo. Production replaces that key with auto-unseal against
  # a cloud KMS; only the custodian of the key changes.
  somaagent_vault:
    container_name: somaagent_vault
    image: hashicorp/vault:1.15
    # Invoke `vault` directly. The image's docker-entrypoint.sh rewrites any
    # `server` command into `vault server -config=/vault/config -dev-...`, so a
    # command that ALSO names a config file loads it twice — two identical tcp
    # listeners on 8200 and "bind: address already in use" from a port nothing
    # else holds. It also injects -dev-root-token-id / -dev-listen-address,
    # which are dev-mode flags and have no business in a real server.
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    ports:
      - "20882:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - somaagent_vault_data:/vault/data
      - somaagent_vault_audit:/vault/audit
    cap_add:
      - IPC_LOCK
    networks:
      - somaagent_net
    healthcheck:
      # Healthy means "the API answers", NOT "unsealed". `vault status` exits 2
      # when sealed and 1 when unreachable, so anything except 1 is a live API
      # that the unseal step can talk to. Gating on "unsealed" would deadlock:
      # nothing could ever start the unseal.
      test: [ "CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ===========================================================================
  # 2a. VAULT LIFECYCLE (init-once, unseal-on-every-boot)
  # ===========================================================================
  # vault_unseal.py: generates unseal key + root token IN MEMORY. Custodian is
  # the OS keychain / operator-held VAULT_UNSEAL_KEY — never a file in the repo.
  # Emits VAULT_TOKEN= on stdout for the seeder (R-SEC-03 bootstrap topology).
  somaagent_vault_unseal:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    profiles: ["legacy-bootstrap"]
    container_name: somaagent_vault_unseal
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./vault_unseal.py:/work/vault_unseal.py:ro
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      # RAM tmpfs custodian for the one-boot handoff (unseal key, root token,
      # postgres password). Not the disk, not the repo (R-SEC-01).
      T0_DIR: /run/t0
    entrypoint: [ "python3", "/work/vault_unseal.py" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault:
        condition: service_healthy
    restart: "no"

  # Durable re-unseal (SOMA-STD-BOOTSTRAP-001 F-19 / brain pattern
  # somabrain_standalone_vault_unseal_watch). Vault reseals on every server
  # restart; the one-shot above only runs at `compose up`. This watcher
  # re-unseals whenever the seal comes back (container restart, crash, host
  # reboot). Same script, same RAM custodian — idempotent, a no-op when
  # already unsealed. It never writes secrets: the custodian is T0_DIR tmpfs.
  somaagent_vault_unseal_watch:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    container_name: somaagent_vault_unseal_watch
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./vault_unseal.py:/work/vault_unseal.py:ro
      # Read-write T0_DIR: unseal key / root token live here after first init
      # (or in the OS keychain on a host-side run). RAM only.
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      T0_DIR: /run/t0
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        while true; do
          python3 /work/vault_unseal.py --unseal-only || true
          sleep 20
        done
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # 2b. SCOPED TOKENS (one-shot) — TTL least-privilege, never root at runtime
  # ===========================================================================
  # vault_scoped_tokens.py is the ONLY place root is used: install
  # vault-policies/*.hcl and mint per-service TTL tokens into the T0_DIR RAM
  # custodian. App/tests then hold agent_runtime_token only (F-10). Root is
  # for unseal + policy one-shots and is never mounted into a long-running
  # service (R-SEC-01 / SOMA-STD-BOOTSTRAP-001 §3.3).
  somaagent_vault_scoped_tokens:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    profiles: ["legacy-bootstrap"]
    container_name: somaagent_vault_scoped_tokens
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./vault_scoped_tokens.py:/work/vault_scoped_tokens.py:ro
      - ./vault-policies:/work/vault-policies:ro
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      T0_DIR: /run/t0
      # Lease length is required operator policy — no default (Rule 91).
      VAULT_TOKEN_TTL_HOURS: ${VAULT_TOKEN_TTL_HOURS:?set VAULT_TOKEN_TTL_HOURS}
    entrypoint: [ "python3", "/work/vault_scoped_tokens.py" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault_unseal:
        condition: service_completed_successfully
    restart: "no"

  # ===========================================================================
  # 2c. VAULT SEEDER (one-shot) — generate-in-memory → Vault only
  # ===========================================================================
  # init_vault.py generates every application credential with secrets.token_urlsafe
  # in process memory and writes them to Vault. It NEVER reads or writes a
  # secret file (R-SEC-01 / Covenant Art 26).
  somaagent_vault_init:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    profiles: ["legacy-bootstrap"]
    container_name: somaagent_vault_init
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./init_vault.py:/work/init_vault.py:ro
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      # Token is read from the T0_DIR RAM custodian written by vault_unseal.py.
      # No compose interpolation of credentials (no VAULT_TOKEN: ${...}).
      T0_DIR: /run/t0
    entrypoint: [ "python3", "/work/init_vault.py" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault_unseal:
        condition: service_completed_successfully
    restart: "no"


  # ===========================================================================
  # 2d. CEREMONIAL SEEDER (one-shot) — SOMA-STD-SECURITY-001
  # ===========================================================================
  # Holds root in process RAM only. Seeds Vault (merge-safe), mints scoped TTL
  # tokens into PER-CONSUMER T0 volumes, drops root, exits. Never writes root or
  # unseal to any consumer T0. Never a password file.
  somaagent_ceremony:
    container_name: somaagent_ceremony
    image: python:3.11-alpine
    working_dir: /work
    volumes:
      - ./bootstrap_exec.py:/work/bootstrap_exec.py:ro
      - ./vault-policies:/work/vault-policies:ro
      - t0_agent:/run/t0:rw
      - t0_postgres:/run/t0_pg:rw
    environment:
      VAULT_ADDR: http://somaagent_vault:8200
      T0_DIR: /run/t0
      T0_MIRROR_DIR: /run/t0_pg
      VAULT_TOKEN_TTL_HOURS: ${VAULT_TOKEN_TTL_HOURS:?set VAULT_TOKEN_TTL_HOURS}
      # Ceremony exits as root (/bin/true). Tokens are chowned to the app UID.
      BOOTSTRAP_DROP_UID: "0"
      BOOTSTRAP_T0_UID: "1000"
      BOOTSTRAP_T0_GID: "1000"
    entrypoint: [ "python3", "/work/bootstrap_exec.py", "--target", "/bin/true", "--" ]
    networks:
      - somaagent_net
    depends_on:
      somaagent_vault:
        condition: service_healthy
    restart: "no"

  # ===========================================================================
  # 3. POSTGRESQL (Database)
  # ===========================================================================
  # Password is generated by init_vault.py into Vault. Channel ENV only:
  # entrypoint_pg_vault.py reads it from Vault into process RAM and execve's
  # postgres. No secret file. No T0 handoff (Operator LAW 2026-10-11).
  somaagent_postgres:
    container_name: somaagent_postgres
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      # Topology only (R-SEC-03). Password arrives via Channel ENV from
      # entrypoint_pg_vault.py (scoped token read → execve). Not a file.
      VAULT_ADDR: http://somaagent_vault:8200
      POSTGRES_USER: somaagent
      POSTGRES_DB: somaagent
      T0_DIR: /run/t0_pg
      VAULT_TOKEN_FILE: /run/t0_pg/agent_runtime_token
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    entrypoint: ["python3", "/work/entrypoint_pg_vault.py"]
    volumes:
      - t0_postgres:/run/t0_pg:rw
      - somaagent_postgres_data:/var/lib/postgresql/data
    depends_on:
      somaagent_vault:
        condition: service_healthy
      somaagent_ceremony:
        condition: service_completed_successfully
    ports:
      - "20432:5432"
    networks:
      - somaagent_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U somaagent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 4. REDIS (Cache)
  # ===========================================================================
  # LOCAL LIMITATION: no auth. Production sets an ACL / requirepass, with the
  # password in Vault. Standalone Redis is on the isolated bridge network only.
  somaagent_redis:
    container_name: somaagent_redis
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "20379:6379"
    volumes:
      - somaagent_redis_data:/data
    networks:
      - somaagent_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 5. KEYCLOAK (Identity - Optional for Standalone)
  # ===========================================================================
  # LOCAL LIMITATION: `start-dev`. Production runs `start --optimized` behind
  # TLS with a real hostname.
  #
  # LOCAL LIMITATION: Keycloak documents KC_DB_PASSWORD and KEYCLOAK_ADMIN_PASSWORD
  # but ships no _FILE variant for either (keycloak.org/server/configuration).
  # Channel ENV only: vault_inject.py reads Vault into process RAM and execve's
  # the Keycloak entrypoint. No secret files. No /run/t0 password handoff
  # (Operator LAW 2026-10-11 / R-SEC-01).
  somaagent_keycloak:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    container_name: somaagent_keycloak
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    entrypoint:
      - /work/bootstrap_exec.sh
      - python3
      - /work/vault_inject.py
      - --target
      - /bin/sh
      - /work/entrypoint-keycloak.sh
    environment:
      # KEYCLOAK_ADMIN is a username, not a secret.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://somaagent_postgres:5432/somaagent
      KC_DB_USERNAME: somaagent
      VAULT_ADDR: http://somaagent_vault:8200
      VAULT_TOKEN_FILE: /run/t0/agent_runtime_token
      T0_DIR: /run/t0
      VAULT_TOKEN_TTL_HOURS: ${VAULT_TOKEN_TTL_HOURS:?set VAULT_TOKEN_TTL_HOURS}
      VAULT_INJECT: >-
        KC_DB_PASSWORD=secret/agent/credentials/postgres_password,
        KEYCLOAK_ADMIN_PASSWORD=secret/agent/credentials/keycloak_admin_password
    ports:
      - "20880:8080"
    networks:
      - somaagent_net
    depends_on:
      somaagent_postgres:
        condition: service_healthy

  # ===========================================================================
  # 6. WEBUI (Lit 3.x Frontend)
  # ===========================================================================
  somaagent_webui:
    container_name: somaagent_webui
    build:
      context: ../../webui
      dockerfile: Dockerfile
    ports:
      - "20080:80"
    networks:
      - somaagent_net
    volumes:
      # Live reload: host dist is served directly. `npm run build` in webui/
      # is enough — no image rebuild. nginx.conf also hot-mounted.
      - ../../webui/dist:/usr/share/nginx/html
      - ../../webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - somaagent_standalone
    restart: unless-stopped

  # ===========================================================================
  # 7. TESTS — run against LIVE infra on somaagent_net
  # ===========================================================================
  # `docker compose run --rm somaagent_tests`
  #
  # The suite must see the same service DNS names the app uses
  # (somaagent_postgres, somaagent_redis, somaagent_vault, ...). There is no
  # localhost topology and no parallel test stack. If a dependency is down the
  # run fails naming it — never skip-to-green.
  somaagent_tests:
    tmpfs:
      - /run/t0:mode=0700,size=1m
    container_name: somaagent_tests
    build:
      context: ../../
      dockerfile: infra/standalone/Dockerfile
    profiles: ["test"]
    env_file:
      - .env
    environment:
      - SA01_DEPLOYMENT_MODE=STANDALONE
      - VAULT_ADDR=http://somaagent_vault:8200
      # Scoped TTL token only (agent_runtime_token from T0_DIR). Never root.
      - VAULT_TOKEN_FILE=/run/t0/agent_runtime_token
      - SA01_DB_HOST=somaagent_postgres
      - SA01_DB_PORT=5432
      - SA01_DB_NAME=somaagent
      - SA01_DB_USER=somaagent
      - POSTGRES_HOST=somaagent_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=somaagent
      - POSTGRES_USER=somaagent
      - REDIS_HOST=somaagent_redis
      - REDIS_PORT=6379
      - SA01_REDIS_URL=redis://somaagent_redis:6379/0
    volumes:
      - ../../admin:/app/admin
      - ../../services:/app/services
      - ../../config:/app/config
      - ../../tests:/app/tests
      - ../../manage.py:/app/manage.py
      - ../../pytest.ini:/app/pytest.ini
    networks:
      - somaagent_net
      - soma-stack-net
    depends_on:
      somaagent_vault:
        condition: service_healthy
      somaagent_vault_scoped_tokens:
        condition: service_completed_successfully
      somaagent_postgres:
        condition: service_healthy
      somaagent_redis:
        condition: service_healthy
    entrypoint: ["python", "-m", "pytest", "tests/", "-v"]
    restart: "no"
