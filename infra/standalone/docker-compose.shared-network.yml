# ═══════════════════════════════════════════════════════════════════════════════
# SomaAgent01 — Shared Network Override
# Attaches the standalone agent stack to the external `soma-stack-net` so it can
# reach real SomaBrain and SomaFractalMemory (see up-cluster.sh).
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.shared-network.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  somaagent_standalone:
    networks:
      - soma-stack-net
    environment:
      # Real triad endpoints — service DNS on soma-stack-net (VIBE Rule 91: no
      # localhost, no default, no underscore host). Required topology only:
      # the value comes from .env / the operator, never from a hardcoded default.
      # Peers address the brain as the RFC 1035 alias `somabrain` (see the
      # brain's docker-compose.shared-network.yml aliases).
      SOMABRAIN_URL: "${SOMABRAIN_URL:?set SOMABRAIN_URL}"
      SOMAFRACTALMEMORY_URL: "${SOMAFRACTALMEMORY_URL:?set SOMAFRACTALMEMORY_URL}"
      # Store bearer tokens are NOT environment variables (Rule 164). The agent
      # reads somabrain_memory_http_token and soma_api_token from Vault at
      # secret/agent/credentials/ via UnifiedSecretManager.get_credential().
      # They are seeded once by init_vault.py from ./secrets/ (t=0 material).
      # Passing a token value through ENV is a secret in `ps`, in
      # /proc/*/environ and in every crash dump.
    extra_hosts: [] # shared network provides DNS

  somaagent_vault:
    networks:
      - soma-stack-net

  somaagent_postgres:
    networks:
      - soma-stack-net

  somaagent_redis:
    networks:
      - soma-stack-net

  somaagent_keycloak:
    networks:
      - soma-stack-net

  somaagent_webui:
    networks:
      - soma-stack-net

networks:
  somaagent_net:
    external: false
  soma-stack-net:
    external: true
    name: soma-stack-net
