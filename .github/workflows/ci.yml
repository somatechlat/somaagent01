name: SomaAgent01 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: services.gateway.settings

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install ruff black
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Black format check
        run: black --check --diff .

  docs:
    name: ISO Document Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Document compliance check
        run: python scripts/check_docs.py

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pyright
          pip install -r requirements.txt
      - name: Pyright
        # No continue-on-error. A type gate that cannot fail is not a gate.
        run: pyright

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install -e ".[aaas]" || pip install -e .
          pip install pytest pytest-asyncio pytest-django
      - name: Run unit tests
        env:
          SA01_DEPLOYMENT_MODE: STANDALONE
          # Database topology — parts, not a DSN. A DSN embeds the password,
          # so there is no SA01_DB_DSN. Unit tests take their password from
          # Vault (secret/agent/credentials/test_db_password) like every other
          # environment.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: somaagent
          POSTGRES_USER: somaagent
          SA01_REDIS_URL: redis://localhost:6379/0
          SA01_KEYCLOAK_URL: http://localhost:20880
          SA01_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          pytest tests/unit/ -v --tb=short -x

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Bandit
        run: pip install bandit safety
      - name: Bandit security scan
        # No `|| true`. A security scan that cannot fail does not scan.
        run: bandit -r admin/ services/ -ll -f json -o bandit-report.json
      - name: Safety dependency check
        run: safety check --json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone image
        run: |
          docker build -f infra/standalone/Dockerfile -t somaagent:test .
