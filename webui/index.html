<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHAQ.AI — Cognitive Agent</title>
    <!-- Local fonts only — CSP style-src 'self' blocks fonts.googleapis.com -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        #app {
            height: 100%;
        }
    </style>

    <style id="soma-brand">
      /* YACHAQ.AI brand marks only. Design tokens stay in tokens.css
         (SOMA-STD-UIUX-001 — one token authority; do not override --platform-*). */
      :root {
        --soma-black: #050505;
        --soma-dark: #0A0A0A;
        --soma-surface: #121212;
        --soma-border: #2A2A2A;
        --soma-orange: #FF4D00;
        --soma-orange-soft: #FF7A3D;
        --soma-orange-deep: #E64500;
        --soma-gradient: linear-gradient(135deg, #FF4D00 0%, #FF7A3D 100%);
        --soma-text: #F8FAFC;
        --soma-text-dim: #94A3B8;
        --soma-font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        --soma-font-display: "Sora", "Inter", system-ui, sans-serif;
        --soma-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      body, html {
        background: var(--platform-bg-void, #f5f5f5);
        color: var(--platform-text-main, #1a1a1a);
        font-family: var(--soma-font);
      }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
